<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🖼️ Image Key Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            resize: vertical;
            transition: border 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn-success:hover { background: #45a049; }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover { background: #da190b; }
        
        .preview-box {
            background: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-box img {
            max-width: 100%;
            max-height: 400px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border-radius: 8px;
            background: white;
        }
        
        .preview-box .placeholder {
            color: #999;
            font-size: 16px;
        }
        
        .info-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }
        
        .info-box.show { display: block; }
        
        .info-box.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #4caf50;
        }
        
        .info-box.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #f44336;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        
        .stat-item .label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .stat-item .value {
            font-size: 16px;
            font-weight: 700;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ Image Key Viewer</h1>
            <p>Base64 key paste kara aani image paha</p>
        </div>

        <div class="card">
            <h2>📋 Base64 Key Paste Kara</h2>
            <textarea id="base64Input" 
                placeholder="SQL madhun copy kela Base64 paste kara yetha..."></textarea>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="displayImage()">
                    🖼️ Display Image
                </button>
                <button class="btn btn-success" onclick="downloadImage()">
                    💾 Download
                </button>
                <button class="btn btn-danger" onclick="clearAll()">
                    🗑️ Clear
                </button>
            </div>
            
            <div id="infoBox" class="info-box"></div>
        </div>

        <div class="card">
            <h2>🖼️ Image Preview</h2>
            <div class="preview-box" id="previewBox">
                <div class="placeholder">Image yethe disel...</div>
            </div>
        </div>
    </div>

    <script>
        function displayImage() {
            const input = document.getElementById('base64Input').value.trim();
            const previewBox = document.getElementById('previewBox');
            const infoBox = document.getElementById('infoBox');
            
            if (!input) {
                showInfo('error', '❌ Base64 key paste kara!');
                return;
            }
            
            // Remove data URI prefix if present
            let base64 = input;
            if (base64.startsWith('data:image')) {
                base64 = base64.split(',')[1];
            }
            
            // Remove whitespace/newlines
            base64 = base64.replace(/\s/g, '');
            
            // Detect image type from base64 prefix
            let contentType = 'image/png';
            if (base64.startsWith('/9j/')) contentType = 'image/jpeg';
            else if (base64.startsWith('R0lGOD')) contentType = 'image/gif';
            else if (base64.startsWith('Qk')) contentType = 'image/bmp';
            else if (base64.startsWith('iVBOR')) contentType = 'image/png';
            
            const dataUri = `data:${contentType};base64,${base64}`;
            
            // Create image to test
            const img = new Image();
            
            img.onload = function() {
                previewBox.innerHTML = '';
                previewBox.appendChild(img);
                
                showInfo('success', `✅ Image successfully loaded! 
                    Size: ${img.width}x${img.height}px | 
                    Type: ${contentType} | 
                    Base64 length: ${base64.length.toLocaleString()} chars`);
                
                // Stats
                const statsHtml = `
                    <div class="stats">
                        <div class="stat-item">
                            <div class="label">Width</div>
                            <div class="value">${img.width}px</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">Height</div>
                            <div class="value">${img.height}px</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">Base64 Size</div>
                            <div class="value">${(base64.length/1024).toFixed(1)} KB</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">Format</div>
                            <div class="value">${contentType.split('/')[1].toUpperCase()}</div>
                        </div>
                    </div>
                `;
                infoBox.innerHTML += statsHtml;
            };
            
            img.onerror = function() {
                previewBox.innerHTML = '<div class="placeholder" style="color:#f44336;">❌ Invalid Base64 key!</div>';
                showInfo('error', '❌ Image load nahi zali. Base64 key valid ahe ka verify kara.');
            };
            
            img.src = dataUri;
            img.style.cssText = 'max-width:100%; max-height:400px; box-shadow:0 8px 25px rgba(0,0,0,0.2); border-radius:8px;';
        }
        
        function downloadImage() {
            const input = document.getElementById('base64Input').value.trim();
            if (!input) {
                alert('❌ Base64 key paste kara!');
                return;
            }
            
            let base64 = input;
            if (base64.startsWith('data:image')) {
                base64 = base64.split(',')[1];
            }
            base64 = base64.replace(/\s/g, '');
            
            // Detect type
            let contentType = 'image/png';
            let ext = 'png';
            if (base64.startsWith('/9j/')) { contentType = 'image/jpeg'; ext = 'jpg'; }
            else if (base64.startsWith('R0lGOD')) { contentType = 'image/gif'; ext = 'gif'; }
            else if (base64.startsWith('Qk')) { contentType = 'image/bmp'; ext = 'bmp'; }
            
            try {
                const byteChars = atob(base64);
                const byteNumbers = new Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) {
                    byteNumbers[i] = byteChars.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: contentType });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Image_${Date.now()}.${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showInfo('success', '✅ Image downloaded!');
            } catch (err) {
                showInfo('error', '❌ Download failed: ' + err.message);
            }
        }
        
        function clearAll() {
            document.getElementById('base64Input').value = '';
            document.getElementById('previewBox').innerHTML = 
                '<div class="placeholder">Image yethe disel...</div>';
            document.getElementById('infoBox').className = 'info-box';
            document.getElementById('infoBox').innerHTML = '';
        }
        
        function showInfo(type, message) {
            const infoBox = document.getElementById('infoBox');
            infoBox.className = `info-box show ${type}`;
            infoBox.innerHTML = message;
        }
        
        // Auto-paste from clipboard (optional)
        window.addEventListener('DOMContentLoaded', () => {
            // Focus textarea
            document.getElementById('base64Input').focus();
        });
    </script>
</body>
</html>
